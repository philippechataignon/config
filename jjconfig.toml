"$schema" = "https://jj-vcs.github.io/jj/latest/config-schema.json"
[ui]
default-command = ["util", "exec", "--", "sh", "-c", """jj st --no-pager && jj lp --no-pager"""]
editor = "vim"
conflict-marker-style = "git"
diff-formatter = ":git"
pager = "less -r -X"

# paginate = "never"
# diff-formatter = ["meld", "$left", "$right"]
# merge-editor = "meld"
# diff-formatter = ["difft", "--color=always", "$left", "$right"]

[user]
name = "Philippe Chataignon"
email = "philippe.chataignon@gmail.com"

[aliases]
ab = ["abandon"]
abs = ["absorb"]
bd = ["bookmark", "delete"]
bdp = ["bookmark", "delete", "glob:push-*"]
bs = ["bookmark", "set"]
bsc = ["bookmark", "set", "-r", "@"]
bsf = ["bookmark", "set", "--allow-backwards"]
bl = ["log", "-r", "bookmarks()", "--no-graph", "-T", 'bookmarks ++ "\n"']
blt = ["bookmark", "list", "--tracked"]
ci = ["commit"]
clr = ["abandon", "-r", "empty() & mutable() & ~ merges()"]
d = ["diff"]
dg = ["diff", "--git"]
del = ["abandon", "--restore-descendants"]
e = ["edit"]
f = ["git", "fetch", "--all-remotes"]
getpush = ["config", "get", "git.push"]
gettrunk = ["config", "get", "revset-aliases.'trunk()'"]
la = ["log", "-r", "::"]
ll = ["log", "-r", "::", "-n", "10"]
l = ["log", "-r", "@ | ancestors(trunk()..(visible_heads() & mine()), 2) | trunk()"]
lc = ["log", "-r", "@ | ancestors(trunk()..(visible_heads() & mine()), 2) | trunk()", "-s"]
lm = ["log", "-r", "master::@"]
lp = ["log", "-T", 'separate(" ", change_id.shortest(4), commit_id.shortest(4),  bookmarks, if(empty, label("empty", "(empty)")), description.first_line(), "(" ++ commit_timestamp(self).ago() ++ ")")']
msg = ["describe", "-m"]
mm = ["bookmark", "set", "master", "-r", "@-"]
mlb = ["bookmark", "move", "--from", "closest_bookmark(@-)", "--to", "@-"]
pa = ["git", "push", "--all"]
pc = ["git", "push", "-c", "@"]
pp = ["git", "push", "--tracked", "--deleted"]
push = ["git", "push"]
rb = ["rebase"]
rbm = ["rebase", "-d", "master"]
rl = ["git", "remote", "list"]
setpush = ["config", "set", "--repo", "git.push"]
settrunk = ["config", "set", "--repo", "revset-aliases.'trunk()'"]
sq = ["squash"]
sqf = ["squash", "--ignore-immutable"]

[git]
write-change-id-header = true
auto-local-bookmark = true

[colors]
"diff token" = {underline = false }
bookmarks = "red"

[template-aliases]
"format_short_id(id)" = "id.shortest(4)"
'format_short_signature(signature)' = 'signature.name()'

[revsets]
# fix = "reachable(@, mutable())"
# simplify-parents = "reachable(@, mutable())"
# 'builtin_immutable_heads()' = 'present(trunk()) | tags() | untracked_remote_bookmarks()'
# 'immutable_heads()' = 'builtin_immutable_heads()'
# 'immutable()' = '::(immutable_heads() | root())'
# 'mutable()' = '~immutable()'
# log = "present(@) | ancestors(immutable_heads().., 2) | present(trunk())"
log = "present(@) | ancestors(immutable_heads().., 2) | present(trunk()) | bookmarks()"

[revset-aliases]
'closest_bookmark(to)' = 'heads(::to & bookmarks())'
